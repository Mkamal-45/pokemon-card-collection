{% extends 'base.html'%}

{% block content%}
<div class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-4 mb-5 pb-4 border-bottom border-2 border-danger">
    <h1 class="header-retro-fight mb-0"> My Card Collection</h1>
    <a href="{{url_for('views.add_card')}}" class="btn-retro-run text-decoration-none">Add New Card</a>
</div>
<div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
    {% for card in cards%}
    <div class="col">
        <div class="card h-100 shadow-sm border-danger">
            <img src="{{card.image}}" class="card-img-top p-3 bg-light" alt="{{card.name}}">
            <div class="card-body">
                <h5 class="card-title fw-bold">{{card.name}}</h5>
                <p class="card-text mb-1"><b>HP:</b> {{card.hp}}</p>
                <p class="card-text mb-1"><b>Type:</b> {{card.type}}</p>
            </div>
            <div class="card-footer bg-white border-top-0">
                <form action="{{ url_for('views.remove_card', card_id=card.id) }}" method="POST">
                    <button type="submit" class="btn btn-sm btn-danger w-100">Remove</button>
                </form>
            </div>
        </div>
    </div>
    {%else%}
    <div class="col-12">
        <div class="alert alert-warning text-center" role="alert">
            Your collection is empty! 
        </div>
    </div>
    {% endfor%}
</div>  
{%endblock%}
